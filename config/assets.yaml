# ---------------------------------------------------------------------------
# Asset registry (seed data). In production this is a view over your EAM/CMMS
# (SAP PM, Maximo, Ultimo, Fiix...) pulled through the `cmms` connector; the
# shape below is the canonical internal model everything else works against.
#
# Deliberately multi-industry: the same pipeline runs for a shipyard, a plant,
# a wind farm or a building portfolio. Only this file changes.
# ---------------------------------------------------------------------------
version: 1

sites:
  - {id: SITE-A, name: "Assembly Hall North", timezone: "Europe/Amsterdam"}
  - {id: SITE-B, name: "Dry Dock 2",          timezone: "Europe/Amsterdam"}
  - {id: SITE-C, name: "Outfitting Quay",     timezone: "Europe/Amsterdam"}

