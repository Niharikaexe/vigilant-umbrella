name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check agentflow tests
      - name: Test
        run: pytest
        env:
          AGENTFLOW_STEP_DELAY_MS: "0"
      - name: Validate integration definitions
        run: |
          python -c "import json,glob,sys; [json.load(open(f)) for f in glob.glob('integrations/**/*.json', recursive=True)]; print('integration JSON valid')"
          python -c "import yaml,glob; [yaml.safe_load(open(f)) for f in glob.glob('config/*.yaml')]; print('config YAML valid')"
